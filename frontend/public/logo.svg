<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Outer circle -->
  <circle cx="40" cy="40" r="38" fill="#EEF2FF" stroke="#1E3A5F" stroke-width="3"/>
  <!-- Browser window -->
  <rect x="12" y="18" width="44" height="34" rx="4" fill="#1E3A5F"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="25" r="2.5" fill="#FF5F57"/>
  <circle cx="27" cy="25" r="2.5" fill="#FFBD2E"/>
  <circle cx="34" cy="25" r="2.5" fill="#28C940"/>
  <!-- Window content area -->
  <rect x="14" y="30" width="40" height="20" rx="1" fill="white"/>
  <!-- Gantt row 1: label + blue bar -->
  <rect x="16" y="33" width="10" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="28" y="33" width="12" height="3" rx="1.5" fill="#3B82F6"/>
  <!-- Gantt row 2: label + green bar -->
  <rect x="16" y="39" width="10" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="32" y="39" width="14" height="3" rx="1.5" fill="#22C55E"/>
  <!-- Gantt row 3: label + amber bar -->
  <rect x="16" y="45" width="10" height="3" rx="1.5" fill="#CBD5E1"/>
  <rect x="36" y="45" width="12" height="3" rx="1.5" fill="#F59E0B"/>
  <!-- Magnifying glass circle -->
  <circle cx="52" cy="54" r="10" fill="white" stroke="#1E3A5F" stroke-width="2.5"/>
  <!-- Check inside magnifying glass -->
  <path d="M47 54 L51 58 L57 50" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Magnifying glass handle -->
  <line x1="59" y1="61" x2="65" y2="67" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
</svg>
