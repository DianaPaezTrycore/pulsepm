version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: pulsepm
      POSTGRES_USER: pulsepm_user
      POSTGRES_PASSWORD: pulsepm_pass
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsepm_user -d pulsepm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://pulsepm_user:pulsepm_pass@db:5432/pulsepm
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
